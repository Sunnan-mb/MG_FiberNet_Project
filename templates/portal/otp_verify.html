{% extends "base.html" %}{% block title %}Verify OTP · M G Fibernet{% endblock %}{% block content %}<section class="narrow-page"><div class="panel form-panel"><span class="action-icon blue">✓</span><h1>Verify your OTP</h1><p class="muted">Enter the six-digit code generated for your registered mobile.</p><form method="post">{% csrf_token %}<label for="otp">One-time password</label><input id="otp" name="otp" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="6-digit OTP"><button class="btn primary full" type="submit">Verify and sign in</button></form><a class="text-button" href="{% url 'otp_request' %}">Try another number</a></div></section>{% endblock %}
